<section
  id="Contact-Me"
  class="contact-section section-bg section-border"
>
  <app-liquid-glass-panel extraClass="contact-panel">
    <h1
      appSpringAnimate
      springAnimation="fade-up-slight"
      [springDelay]="200"
      class="contact-heading font-display font-semibold text-center section-text"
    >
      Get in Touch
    </h1>
    <p
      appSpringAnimate
      springAnimation="fade-up-slight"
      [springDelay]="400"
      class="contact-body font-normal text-center section-text"
    >
      Although I'm not currently looking for any new opportunities, my inbox is always open. Whether you have a question or just want to say hi, I'll try my best to get back to you!
    </p>
    <a
      appSpringAnimate
      springAnimation="fade-up"
      [springDelay]="600"
      href="mailto:dissanayakedmmb@gmail.com"
      class="contact-cta section-cta self-center transition-colors"
    >
      Say Hi
    </a>
  </app-liquid-glass-panel>
</section>
