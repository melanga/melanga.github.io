<nav
  class="nav-theme nav-glass relative w-full flex h-16 px-5 rounded-glass items-center"
>
  <app-logo />
  <div class="list-none w-full h-full flex md:ml-12 justify-end items-center gap-4">
    <button
      type="button"
      class="theme-toggle p-2 rounded-lg transition-colors hover:opacity-80"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (themeService.theme() === 'dark') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      }
    </button>
    @if (isMobile()) {
      <button
        type="button"
        class="menu-toggle md:hidden theme-toggle"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
      >
        @if (menuOpen()) {
          <svg
            class="menu-toggle-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <span class="menu-toggle-bars">
            <span class="block w-5 h-0.5 theme-toggle-bar"></span>
            <span class="block w-5 h-0.5 theme-toggle-bar"></span>
            <span class="block w-5 h-0.5 theme-toggle-bar"></span>
          </span>
        }
      </button>
    } @else {
      <ul class="list-none flex justify-end items-center gap-8">
        @for (item of navItems; track item.anchorId) {
          <li class="flex items-center cursor-pointer font-medium text-sm box-content">
            <a
              [attr.href]="'#' + item.anchorId"
              [anchorId]="item.anchorId"
              appScrollTo
              class="nav-link"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    }
  </div>
</nav>

@if (isMobile() && menuOpen()) {
  <div
    class="nav-menu-mobile"
    role="dialog"
    aria-modal="true"
    aria-label="Navigation menu"
  >
    <div class="nav-menu-panel liquid-glass">
      <nav class="nav-menu-links" aria-label="Mobile navigation">
        @for (item of navItems; track item.anchorId) {
          <a
            [attr.href]="'#' + item.anchorId"
            [anchorId]="item.anchorId"
            appScrollTo
            (click)="closeMenu()"
            class="nav-link nav-menu-link"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  </div>
}
