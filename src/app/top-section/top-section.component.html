<section
  id="About"
  class="top-section-landing relative flex min-h-screen w-full flex-col justify-center pt-[var(--header-height)]"
>
  <div class="hero-container">
    <div class="hero-layout">
      <!-- Left: text content -->
      <div class="hero-text">
        <div class="hero-headlines">
          <p
            appSpringAnimate
            springAnimation="fade-up-slight"
            [springDelay]="200"
            [springImmediate]="true"
            class="hero-line"
          >
            Hi, I'm&nbsp;
          </p>
          <p
            appSpringAnimate
            springAnimation="fade-up-slight"
            [springDelay]="400"
            [springImmediate]="true"
            class="hero-line hero-accent"
          >
            Melanga
          </p>
          <p class="hero-line hero-typed-line">
            <span #typedTarget class="typed-outline"></span>
          </p>
        </div>

        <p
          appSpringAnimate
          springAnimation="fade-in"
          [springDelay]="600"
          [springImmediate]="true"
          class="hero-subtitle"
        >
          I'm an enthusiastic Software Engineer with a Bachelors (Hons) in Industrial
          Information Technology. Machine Learning, Neural Networks (NLP, CV), and
          Software Development are my core interests.
        </p>

        <div
          appSpringAnimate
          springAnimation="fade-up"
          [springDelay]="800"
          [springImmediate]="true"
          class="hero-actions"
        >
          <a href="#Projects" appScrollTo anchorId="Projects" class="hero-cta hero-cta-primary">
            View Projects
          </a>
          <a href="#Technologies" appScrollTo anchorId="Technologies" class="hero-cta hero-cta-secondary">
            Explore Tech
          </a>
          <a href="#Contact-Me" appScrollTo anchorId="Contact-Me" class="hero-cta hero-cta-ghost">
            Contact Me
          </a>
        </div>
      </div>

      <!-- Right: profile portrait card -->
      <div
        appSpringAnimate
        springAnimation="slide-left"
        [springDelay]="500"
        [springImmediate]="true"
        class="hero-portrait-wrap"
      >
        <div class="hero-portrait liquid-glass">
          <img
            ngSrc="assets/images/profile_photo.jpg"
            width="280"
            height="280"
            alt="Melanga Dissanayake"
            class="hero-portrait-img"
            priority
          />
          <div class="hero-portrait-glow"></div>
        </div>
      </div>
    </div>
  </div>

  <a
    href="#Technologies"
    appScrollTo
    anchorId="Technologies"
    appSpringAnimate
    springAnimation="fade-in"
    [springDelay]="1000"
    [springImmediate]="true"
    class="hero-scroll-hint"
    aria-label="Scroll to Technologies"
  >
    <span class="hero-scroll-label">Scroll</span>
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 16 16">
      <path
        fill-rule="evenodd"
        d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V4.5z"
      />
    </svg>
  </a>
</section>
